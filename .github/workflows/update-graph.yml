name: Update contribution graph
on:
  schedule: [{ cron: "0 */3 * * *" }]
  push: { branches: [main, master], paths-ignore: ["assets/*.svg"] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/gen_graph.py
        env:
          GH_USER: Jeevan-33
          # Optional: add a PAT (read:user) as secret PROFILE_TOKEN to include private contributions
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/race-track.svg assets/github-stats.svg
          git diff --cached --quiet || (git commit -m "chore: update contribution graph" && git push)
