<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#bfdbfe"/></pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dbeafe" stop-opacity="1"/><stop offset=".55" stop-color="#dbeafe" stop-opacity=".85"/><stop offset="1" stop-color="#dbeafe" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1000" height="230" rx="12" fill="#dbeafe" stroke="#93c5fd"/>
  <rect x="1" y="1" width="998" height="228" rx="11" fill="url(#dots)"/>
  <rect x="1" y="1" width="998" height="228" rx="11" fill="url(#fade)"/>
  <rect x="56" y="52" width="4" height="118" rx="2" fill="#2563eb"/>
